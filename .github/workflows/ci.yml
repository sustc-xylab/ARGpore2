# Syntax check, and confirm `argpore2 check` fails when reference data are absent.
# This does not run the analysis. Same steps as .cnb.yml.

name: ci

on:
  push:
    branches: [master, main, mhb]
  pull_request:
    branches: [master, main, mhb]

jobs:
  syntax-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: bash-syntax
        run: |
          set -eu
          for script in argpore.sh setup.sh setup-tools.sh setup-db.sh check-setup.sh setup_fast.sh; do
            bash -n "$script"
          done
          python -m pip install -e .
          argpore2 --help
          if [ -s database/PLSDB_2020_03_04.fna ]; then
            echo "reference data present; skip the expected-failure check"
            exit 0
          fi
          if argpore2 check; then
            echo "argpore2 check should fail when reference data are absent"
            exit 1
          fi
          echo "argpore2 check failed as expected"
